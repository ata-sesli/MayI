[policy]
# strict: approve/hold/deny; approve-or-hold: human review instead of denial.
mode = "strict"

[julia]
# Install SupersonicLabs/Julia-1's Python package and download its checkpoint.
# model = "/absolute/path/to/Julia-1"
device = "cpu"
approval_threshold = 0.98

[server]
unix_socket = "~/.mayi/mayi.sock"
request_timeout = 10.0

[http]
enabled = false
host = "127.0.0.1"
port = 7411
# Prefer MAYI_BEARER_TOKEN over storing a token here.
# ssl_cert = "/absolute/path/to/cert.pem"
# ssl_key = "/absolute/path/to/key.pem"

[storage]
path = "~/.local/share/mayi/mayi.zova"
retain_input = false

# Optional ordered hook endpoints. Without this section, the hook uses
# server.unix_socket. Stop at the first valid decision, including HOLD/DENY.
# [hook]
# timeout = 25.0
# connect_timeout = 2.0
# Optional override; otherwise a private state file is chosen per config path.
# state_file = "~/.local/state/mayi/hook.json"
# Optional private routing log, capped at 1 MiB; no commands or credentials.
# telemetry_file = "~/.local/state/mayi/hook.telemetry.jsonl"
# The last endpoint to return a valid decision is tried first next time.
#
# [[hook.endpoints]]
# unix_socket = "~/.mayi/mayi.sock"
# timeout = 12.0
#
# [[hook.endpoints]]
# url = "https://server.YOUR-TAILNET.ts.net/v1/decide"
# token_file = "~/.config/mayi/remote.token"
# timeout = 12.0
# Set the outer Codex hook timeout to 30 seconds for these settings.
